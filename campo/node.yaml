# Monitor local de la prueba en campo: la Pi y los equipos reales del almacen.
installation_id: ALMACEN-1-CAMPO
name: RoomFID - prueba en sombra
timezone: Europe/Madrid
interval_s: 15
node_version: 0.1.0
listen: { host: 0.0.0.0, port: 8080 }

thresholds:
  disk_pct: { warn: 85, crit: 95 }
  temp_c:   { warn: 70, crit: 80 }
  cpu_pct:  { warn: 90 }

agentes: {}   # token en ROOMFID_AGENTES_TOKEN (.env)

devices:
  # La Pi informa con su agente (campo-monitor-agente): su sistema y contenedores y, desde
  # irfid, los almacenes, quirofanos, papeleras, lectores y antenas que cuelgan de ella.
  - device_code: PI-SOMBRA
    label: Raspberry sombra
    type: raspberry
    remoto: true
