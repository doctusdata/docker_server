# RoomFID - DESPLIEGUE en Raspberry (solo ejecucion).
#
# Identico al compose del banco salvo en una cosa: aqui NO se construye nada. Cada
# servicio propio arranca de una imagen arm64 ya construida en la maquina de
# desarrollo (clon/construir-arm64.sh) y cargada aqui con instalar.sh.
#
# Por eso esta Raspberry no lleva codigo fuente: solo imagenes, configuracion y datos.
# Para actualizar algo se reconstruye alli y se vuelve a copiar el paquete.
#
# Las etiquetas se fijan con ETIQUETA en el .env (por defecto 'latest'), asi se puede
# volver a una version anterior sin tocar este fichero.
name: roomfid-banco

volumes:
  pgdata:
  mosquitto-data:
  irfid-spool:
  monitor-data:

x-irfid-env: &irfid-env
  TZ: ${TZ:-Europe/Madrid}
  IRFID_PG_DSN: "host=pg port=5432 dbname=gestion_rfid user=rfidroom password=${RFID_PG_PASSWORD}"
  IRFID_MQTT_HOST: mosquitto
  IRFID_MQTT_USERNAME: ${MQTT_USER}
  IRFID_MQTT_PASSWORD: ${MQTT_PASS}
  # El espejo legacy ya no se puede encender: desde 018 los estados son los de la
  # gestion (almacen, en_transito, usado, retirado) y escribir en EPC_readings
  # pondria alli la semantica antigua. El servicio se niega a arrancar con "true".
  IRFID_LEGACY_MIRROR: "false"
  IRFID_LEGACY_TZ: ${TZ:-Europe/Madrid}
  IRFID_CICLOS_PARA_CIRCULANTE: ${IRFID_CICLOS_PARA_CIRCULANTE:-3}
  # Minutos que una devolucion manual del visor protege a la etiqueta de volver a
  # salir. Por encima de la sombra medida (21 min el 26/10 en etiquetas presentes).
  # A 0 se desactiva. Va en el ancla porque irfid-almacen la hereda de aqui.
  IRFID_GRACIA_DEVOLUCION_MIN: ${IRFID_GRACIA_DEVOLUCION_MIN:-30}
  IRFID_MINUTOS_PARA_CIRCULANTE: ${IRFID_MINUTOS_PARA_CIRCULANTE:-30}
  IRFID_HORAS_ALERTA_TEMPORAL: ${IRFID_HORAS_ALERTA_TEMPORAL:-24}
  IRFID_VENTANA_MIN_S: ${IRFID_VENTANA_MIN_S:-30}
  IRFID_VENTANA_GAP_S: ${IRFID_VENTANA_GAP_S:-20}
  IRFID_SMTP_HOST: mailpit
  IRFID_SMTP_PORT: "1025"
  IRFID_SMTP_STARTTLS: "false"
  IRFID_SMTP_FROM: roomfid@banco.local
  IRFID_LOG_LEVEL: ${IRFID_LOG_LEVEL:-INFO}

x-irfid: &irfid
  image: roomfid/irfid:${ETIQUETA:-latest}
  restart: unless-stopped
  depends_on:
    pg:
      condition: service_healthy
    mosquitto:
      condition: service_started
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status==200 else 1)"]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 30s

services:
  pg:
    image: postgres:18
    container_name: banco-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASS}
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      RFID_PG_PASSWORD: ${RFID_PG_PASSWORD}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./volcado:/volcado:ro
    ports:
      - "${PUERTO_PG:-5432}:5432"   # 5432 en la Pi: el lector de puerta entra por JDBC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfidroom -d gestion_rfid"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: banco-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"

  api:
    image: roomfid/api:latest
    container_name: banco-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./api/app.json:/app/config/app.json:ro
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "3000:3000"

  irfid-almacen:
    <<: *irfid
    container_name: banco-irfid-almacen
    command: ["sh", "-c", "python -m irfid migrar && python -m irfid bootstrap && exec python -m irfid almacen"]
    environment:
      <<: *irfid-env
      IRFID_MQTT_CLIENT_ID: irfid-almacen
      IRFID_SPOOL_PATH: /data/spool/irfid-spool.sqlite3
    volumes:
      - irfid-spool:/data/spool
      - ./topologia.json:/app/topologia.json:ro
      # **Sin montajes de parches, y asi tiene que seguir.** Hasta el 11/11 aqui se
      # montaban `api.py` y `repo.py` encima de la imagen. Ya no hace falta: la imagen
      # los lleva dentro, con la gracia de devolucion, las dos defensas del canal y las
      # migraciones hasta la 022. Comprobado dentro del contenedor antes de quitarlos.
      #
      # **No volver a montar codigo aqui.** Un montaje tapa lo que trae la imagen **en
      # silencio**: la Pi ejecutaria el fichero de fuera y nadie lo notaria. Si hay que
      # cambiar algo, se reconstruye la imagen con construir-arm64.sh.
    ports:
      - "8090:8090"
      # API de papeleras: por aqui entran las sesiones de los terminales
      # papelerIA, firmadas con HMAC. Va al 8092 del host porque el 8091 ya lo
      # ocupa el orquestador, que dentro de su contenedor tambien usa el 8090.
      - "8092:8091"

  irfid-orquestador:
    <<: *irfid
    container_name: banco-irfid-orquestador
    # Sin orquestador (ORQUESTADOR=no en .env) las ventanas se detectan por inactividad:
    # util si alguien enciende/para los lectores a mano.
    profiles: ["orquestador"]
    command: ["python", "-m", "irfid", "orquestador"]
    environment:
      <<: *irfid-env
      IRFID_MQTT_CLIENT_ID: irfid-orquestador
      IRFID_ORQ_VENTANA_S: ${IRFID_ORQ_VENTANA_S:-120}
      IRFID_ORQ_PAUSA_S: ${IRFID_ORQ_PAUSA_S:-5}
      IRFID_ORQ_PERIODO_S: ${IRFID_ORQ_PERIODO_S:-300}
      # Los dos lectores a la vez (true) o uno detras de otro como hacia Node-RED
      # (false). **No estaba declarado aqui, y ponerlo solo en el .env no hacia nada**:
      # este bloque no hereda las IRFID_ORQ_*, las enumera. Se expone para poder medir
      # si leer en serie sube la cobertura por pasada -- la hipotesis de interferencia
      # entre los dos lectores de la misma sala, que sigue sin demostrar.
      IRFID_ORQ_PARALELO: ${IRFID_ORQ_PARALELO:-true}
      IRFID_ORQ_DIGEST_USER: ${LECTOR_USER:-admin}
      IRFID_ORQ_DIGEST_PASSWORD: ${LECTOR_PASS:-admin}
    ports:
      - "8091:8090"

  visor:
    image: roomfid/visor:${ETIQUETA:-latest}
    container_name: banco-visor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      RFID_API_URL: http://api:3000/api
      RFID_API_KEY: ${API_KEY}
      # Segunda fuente: el stock por almacen y el estado de los lectores salen de irfid,
      # no de la API heredada. Por nombre de servicio: 127.0.0.1 seria el visor mismo.
      ALMACEN_API_URL: http://irfid-almacen:8090
      INVENTARIO_API_URL: http://irfid-almacen:8093
      CORS_ORIGINS: http://localhost:8020
      # 3 s y no los 10 por defecto. La cache del backend se suma a la relectura del
      # navegador, asi que con 10 un numero tardaba hasta 40 s en cambiar y la tarjeta
      # y la tabla podian discrepar todo ese rato. Medido el 4/11: tres peticiones
      # seguidas devolvian el mismo `generado_at`. Cuesta una consulta mas cada pocos
      # segundos contra una API de **solo lectura**: barato.
      CACHE_TTL_SECONDS: "3"
    # Sin volumenes: el panel compilado, la ruta de devolver y el `post()` que tira la
    # cache van dentro de la imagen desde el 11/11. Antes se montaban desde `parches/`.
    ports:
      - "8020:8020"

  monitor:
    image: roomfid/monitor:latest
    container_name: banco-monitor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      ROOMFID_AGENTES_TOKEN: ${ROOMFID_AGENTES_TOKEN}
    volumes:
      - ./node.yaml:/etc/roomfid/node.yaml:ro
      - monitor-data:/data
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: banco-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Agente de monitorizacion de esta Pi: red de host (sondea los lectores y llega a
  # irfid y al nodo por los puertos publicados), disco y contenedores en solo lectura.
  monitor-agente:
    image: roomfid/agente:latest
    container_name: banco-monitor-agente
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Madrid}
      ROOMFID_AGENTE_TOKEN: ${ROOMFID_AGENTES_TOKEN}
    volumes:
      - ./agente.yaml:/etc/roomfid/agente.yaml:ro
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
